name: Build Spotify Plus APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Runner images already include the Android SDK; the setup-android action
      # currently fails installing the obsolete 'tools' package, so skip it.

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/spotifyplus-release.jks

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build signed Release APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ github.workspace }}/spotifyplus-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyPlus-Release-APK
          path: app/build/outputs/apk/release/app-release.apk